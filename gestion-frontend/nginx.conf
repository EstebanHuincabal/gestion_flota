upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name 157.180.85.17 _;

    # ── Headers de seguridad ──────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"                       always;
    add_header X-Frame-Options         "DENY"                          always;
    add_header X-XSS-Protection        "1; mode=block"                 always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "geolocation=(), camera=(), microphone=()" always;

    # ── Compatibilidad de red entre distintos ISP/operadores ──
    # Ajusta el MSS para evitar fragmentación de paquetes (problema frecuente
    # cuando clientes de distintos operadores tienen MTU diferente).
    tcp_nodelay on;
    tcp_nopush  on;
    sendfile    on;

    # Compresión gzip — reduce tamaño de respuestas y mejora conectividad
    # en redes lentas o con pérdida de paquetes.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   4;
    gzip_min_length   1000;
    gzip_types        text/plain text/css text/xml text/javascript
                      application/javascript application/json
                      application/xml+rss image/svg+xml;

    # Subidas (fotos de solicitudes, comprobantes, documentos: hasta 10 MB)
    client_max_body_size 25M;

    # ── Archivos estáticos del backend (admin de Django, DRF) ──
    location /static/ {
        alias /staticfiles/;
        access_log off;
        expires 7d;
    }

    # ── Archivos subidos por usuarios ──
    location /media/ {
        alias /media/;
        access_log off;
        expires 7d;
    }

    # ── API REST ──
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            $http_origin;
    }

    # ── Admin de Django ──
    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSockets (Channels) ──
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # ── PWA: service worker y manifest ──
    # El service worker (registerType: 'autoUpdate') no debe quedar cacheado:
    # si el navegador o un proxy lo retiene, los usuarios no reciben las
    # actualizaciones hasta que expira esa caché.
    location ~* ^/(sw\.js|registerSW\.js|workbox-.*\.js)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        expires off;
    }

    # nginx no trae el tipo MIME de .webmanifest por defecto.
    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        default_type application/manifest+json;
    }

    # ── SPA (Vue Router en modo history) ──
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
