upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name 157.180.85.17 _;

    # Subidas (fotos de solicitudes, comprobantes, documentos: hasta 10 MB)
    client_max_body_size 25M;

    # ── Archivos estáticos del backend (admin de Django, DRF) ──
    location /static/ {
        alias /staticfiles/;
        access_log off;
        expires 7d;
    }

    # ── Archivos subidos por usuarios ──
    location /media/ {
        alias /media/;
        access_log off;
        expires 7d;
    }

    # ── API REST ──
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Admin de Django ──
    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSockets (Channels) ──
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # ── SPA (Vue Router en modo history) ──
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
